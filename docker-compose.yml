services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    command:
    - postgres
    - -c
    - max_locks_per_transaction=256
    environment:
      POSTGRES_USER: warmbly
      POSTGRES_PASSWORD: warmbly
      POSTGRES_DB: warmbly_dev
    volumes:
    - ${WARMBLY_PG_DATA:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U warmbly
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
    - '5432'
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
    - ${WARMBLY_REDIS_DATA:-redis_data}:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
    - '6379'
  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - ${WARMBLY_NATS_DATA:-nats_data}:/data
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8222/healthz
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
    - '4222'
    - '8222'
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:latest
    profiles:
    - sandbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    expose:
    - '8025'
    - '1025'
  dovecot:
    restart: unless-stopped
    image: dovecot/dovecot:latest
    profiles:
    - sandbox
    environment:
      USER_PASSWORD: '{PLAIN}sandbox'
    healthcheck:
      test:
      - CMD
      - doveadm
      - service
      - status
      - imap-login
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
    - '31143'
    - '31993'
  backend:
    restart: unless-stopped
    stop_grace_period: 60s
    image: ${WARMBLY_IMAGE_PREFIX:-ghcr.io/warmbly/warmbly}/backend:${WARMBLY_TAG:-prod}
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        VERSION: ${WARMBLY_BUILD_VERSION:-}
        COMMIT: ${WARMBLY_BUILD_COMMIT:-}
        BUILT_AT: ${WARMBLY_BUILD_TIME:-}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AWS_CONFIG_ENABLED: ${AWS_CONFIG_ENABLED:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-development-secret-key-base-minimum-64-characters-for-phoenix}
